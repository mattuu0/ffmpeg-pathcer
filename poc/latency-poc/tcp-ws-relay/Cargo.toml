[package]
name = "tcp-ws-relay"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "tcp-ws-relay"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
mdns-sd = "0.13"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
